name: test

on: push

jobs:
  gotest:
    if: github.event.pusher.name != 'dreamkast-cloudnativedays'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: golangci-lint
        if: matrix.arch == 'amd64'
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
      - name: Run Test
        run: |
          make test
          git diff --exit-code
      - name: Build container image
        run: docker build --platform linux/${{ matrix.arch }} -t seaman:test .
      - name: Check container executables
        run: |
          docker run --rm --network none seaman:test --help
          docker run --rm --network none --entrypoint git seaman:test --version
