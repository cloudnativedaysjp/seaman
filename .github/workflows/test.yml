name: test

on: push

jobs:
  gotest:
    if: github.event.pusher.name != 'dreamkast-cloudnativedays'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: golangci-lint
        if: matrix.arch == 'amd64'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      - name: Run Test
        run: |
          make test
          git diff --exit-code
      - name: Build container image
        run: docker build --platform linux/${{ matrix.arch }} -t seaman:test .
      - name: Check container executables
        run: |
          docker run --rm --network none seaman:test --help
          docker run --rm --network none --entrypoint git seaman:test --version
